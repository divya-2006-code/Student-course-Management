<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Admin Login | SCMS</title><link rel="stylesheet" href="../css/style.css"></head>
<body><header class="navbar"><a class="logo" href="../index.html">SCMS Admin</a><nav class="nav-links"><a href="../index.html">Home</a><a href="login.html">Admin Login</a></nav></header>
<main class="auth-page"><div class="auth-card"><h1>Admin Login</h1><p class="muted">Sign in to manage the SCMS platform.</p><div id="msg"></div><form id="form"><div class="form-group"><label>Email</label><input id="email" type="email" required></div><div class="form-group"><label>Password</label><input id="password" type="password" required></div><button class="btn" type="submit">Login</button></form></div></main><footer class="footer"><p>© 2026 Student Course Management System</p></footer>
<script src="../js/main.js"></script><script>form.onsubmit=e=>{e.preventDefault();if(loginAdmin(email.value,password.value))location.href="dashboard.html";else msg.innerHTML='<div class="alert error">Invalid admin credentials.</div>'}</script></body></html>
