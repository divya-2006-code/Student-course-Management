<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit Course | SCMS</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<script>renderNav("admin")</script><main class="page"><div class="container"><div class="form-card"><h1>Edit Course</h1><form id="form"><div class="form-group"><label>Course Name</label><input id="title" required></div><div class="form-group"><label>Category</label><input id="category" required></div><div class="form-group"><label>Instructor</label><input id="instructor" required></div><div class="form-group"><label>Duration</label><input id="duration" required></div><div class="form-group"><label>Level</label><select id="level"><option>Beginner</option><option>Intermediate</option><option>Advanced</option></select></div><div class="form-group"><label>Description</label><textarea id="description" required></textarea></div><div class="form-actions"><button class="btn">Save Changes</button><a class="btn secondary" href="courses.html">Cancel</a></div></form></div></div></main>
<script>if(protect("admin")){let id=Number(new URLSearchParams(location.search).get("id"));let l=getData("scms_courses",courses);let c=l.find(x=>x.id===id)||l[0];title.value=c.title;category.value=c.category;instructor.value=c.instructor;duration.value=c.duration;level.value=c.level;description.value=c.description;form.onsubmit=e=>{e.preventDefault();Object.assign(c,{title:title.value,category:category.value,instructor:instructor.value,duration:duration.value,level:level.value,description:description.value});saveData("scms_courses",l);location.href="courses.html"}}}</script>

<script src="../js/main.js"></script>
</body>
</html>
